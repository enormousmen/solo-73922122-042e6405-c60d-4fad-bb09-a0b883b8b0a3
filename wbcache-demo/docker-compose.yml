services:
  wbcache:
    build: .
    image: wbcache-demo:latest
    container_name: wbcache-demo
    ports:
      - "8000:8000"
    environment:
      IMAGE_PATH: /data/disk.img
      BLOCK_COUNT: "32"
      # seconds between block persist steps inside one FLUSH round
      FLUSH_DELAY: "0.6"
    volumes:
      - diskimg:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/state', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  diskimg:
